name: Build PRECORDER

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q PRECORDER-project-scaffold.zip -d extracted

      - name: Build mod
        run: |
          BUILD_FILE=$(find extracted -name build.gradle -print -quit)
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PRECORDER-build
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
