
name: Build PRECORDER

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -q PRECORDER-project-scaffold.zip -d project

      - name: Build PRECORDER
        run: |
          BUILD_FILE=$(find project -name build.gradle -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "build.gradle not found"
            exit 1
          fi
          cd "$(dirname "$BUILD_FILE")"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PRECORDER-build
          path: project/**/build/libs/*.jar
          if-no-files-found: error
          
